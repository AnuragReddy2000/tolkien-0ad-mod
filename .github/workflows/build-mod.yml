name: Validate and package mod

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate mod data and faction catalogs
        run: python tools/validate_mod.py
      - name: Build versioned mod archive
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python tools/package_mod.py --output-dir dist --tag "$GITHUB_REF_NAME"
          else
            python tools/package_mod.py --output-dir dist --commit "$GITHUB_SHA"
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tolkien-mod-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download versioned archives
        uses: actions/download-artifact@v4
        with:
          name: tolkien-mod-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
